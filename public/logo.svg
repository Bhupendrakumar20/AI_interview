<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Green background -->
  <rect width="40" height="40" rx="6" fill="#10B981"/>
  
  <!-- Briefcase icon -->
  <g transform="translate(8, 10)">
    <!-- Briefcase body -->
    <rect x="2" y="4" width="20" height="13" rx="1" fill="white" stroke="white" stroke-width="1.5"/>
    <!-- Briefcase handle -->
    <path d="M 6 4 Q 6 2 12 2 Q 18 2 18 4" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Middle divider -->
    <line x1="12" y1="4" x2="12" y2="17" stroke="#10B981" stroke-width="1"/>
  </g>
  
  <!-- Text: Career! -->
  <text x="20" y="34" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Career!</text>
</svg>
